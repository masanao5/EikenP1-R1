<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>英検準1級｜大問1 直前特訓</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101827;
    --panel: #182437;
    --panel-2: #202f45;
    --line: #34445c;
    --text: #f4f7fb;
    --muted: #aab7c9;
    --accent: #67d5c2;
    --accent-dark: #123f3a;
    --red: #ff7777;
    --green: #69d7a7;
    --yellow: #f4c96b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  button, select { font: inherit; }
  button { cursor: pointer; }
  .app { width: min(100% - 28px, 820px); margin: 0 auto; padding: 22px 0 40px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: clamp(1.25rem, 4vw, 1.7rem); line-height: 1.3; margin: 0; letter-spacing: .01em; }
  .subtitle { color: var(--muted); font-size: .82rem; margin-top: 5px; }
  .reset {
    flex: 0 0 auto; color: var(--muted); background: transparent; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; font-size: .78rem;
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .progress-panel { margin-bottom: 14px; }
  .progress-top { display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:.88rem; }
  .progress-top strong { font-variant-numeric: tabular-nums; }
  .progress-track { height: 9px; background: #34445c; border-radius: 99px; overflow:hidden; margin: 10px 0 8px; }
  .progress-fill { height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .2s; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:.78rem; }
  .controls { display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:14px; }
  .control label { display:block; color:var(--muted); font-size:.75rem; margin:0 0 5px 2px; }
  select {
    width:100%; color:var(--text); background:var(--panel-2); border:1px solid var(--line);
    border-radius:10px; padding:11px 36px 11px 12px; min-height:46px;
  }
  .question-panel { padding:18px; }
  .question-meta { display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted); font-size:.8rem; margin-bottom:14px; }
  .timer { font-variant-numeric:tabular-nums; font-weight:700; color:var(--accent); }
  .timer.over { color:var(--red); }
  .question { font-size:clamp(1.1rem, 4.5vw, 1.42rem); line-height:1.75; font-weight:650; overflow-wrap:anywhere; margin:0 0 20px; }
  .choices { display:grid; gap:9px; }
  .choice {
    display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left;
    color:var(--text); background:var(--panel-2); border:1px solid var(--line);
    border-radius:12px; padding:13px 14px; min-height:54px; transition:border-color .15s, background .15s;
  }
  .choice:focus-visible, button:focus-visible, select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .choice:not(:disabled):active { transform:scale(.995); }
  .choice:disabled { cursor:default; opacity:1; }
  .choice-num {
    display:grid; place-items:center; width:27px; height:27px; flex:0 0 27px;
    border-radius:8px; background:#34445c; color:#fff; font-size:.83rem; font-weight:750;
  }
  .choice.correct { border-color:var(--green); background:#17372f; }
  .choice.correct .choice-num { background:var(--green); color:#09251b; }
  .choice.wrong { border-color:var(--red); background:#3b252d; }
  .choice.wrong .choice-num { background:var(--red); color:#2b1015; }
  .feedback { margin-top:16px; }
  .result { font-weight:800; font-size:1.05rem; margin-bottom:8px; }
  .result.good { color:var(--green); } .result.bad { color:var(--red); }
  .translation, .explanation { color:#e2e9f2; font-size:.91rem; }
  .translation { margin-bottom:12px; }
  .feedback h3 { font-size:.83rem; color:var(--muted); margin:15px 0 8px; }
  .meaning-list { list-style:none; padding:0; margin:0; display:grid; gap:7px; }
  .meaning-list li { background:var(--panel-2); border:1px solid transparent; border-radius:9px; padding:9px 11px; font-size:.84rem; }
  .meaning-list li.correct-meaning { border-color:var(--green); background:#17372f; }
  .meaning-list b { display:inline-block; min-width:23px; color:var(--muted); }
  .meaning-list .answer-tag { color:var(--green); font-size:.72rem; margin-left:7px; font-weight:700; }
  .actions { display:flex; gap:9px; margin-top:17px; }
  .primary, .secondary {
    border:0; border-radius:11px; padding:13px 16px; min-height:48px; font-weight:750;
  }
  .primary { flex:1; color:#062a27; background:var(--accent); }
  .primary:disabled { opacity:.4; cursor:not-allowed; }
  .secondary { color:var(--text); background:var(--panel-2); border:1px solid var(--line); }
  .hint { color:var(--muted); font-size:.73rem; margin-top:12px; text-align:center; }
  .empty { text-align:center; padding:34px 16px; color:var(--muted); }
  .empty strong { display:block; color:var(--text); font-size:1.05rem; margin-bottom:7px; }
  .hidden { display:none !important; }
  @media (min-width:650px) {
    .app { padding-top:34px; }
    .controls { grid-template-columns:1fr 1fr; }
    .question-panel { padding:24px; }
    .choices { grid-template-columns:1fr 1fr; }
    .choice { min-height:64px; align-items:center; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { transition:none !important; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>英検準1級｜大問1 直前特訓</h1>
      <div class="subtitle">短文語句空所補充 · 1問ずつテンポよく演習</div>
    </div>
    <button class="reset" id="resetBtn" type="button">履歴をリセット</button>
  </header>

  <section class="panel progress-panel" aria-label="学習進捗">
    <div class="progress-top">
      <span>習得済み</span>
      <strong id="masteredCount">0 / 0問</strong>
    </div>
    <div class="progress-track" role="progressbar" aria-label="習得済み問題数" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="stats">
      <span>累計正答率 <strong id="accuracy">—</strong></span>
      <span>要復習 <strong id="reviewCount">0問</strong></span>
      <span>解答数 <strong id="attemptCount">0問</strong></span>
    </div>
  </section>

  <section class="controls" aria-label="出題設定">
    <div class="control">
      <label for="sessionFilter">出題範囲</label>
      <select id="sessionFilter">
        <option value="all">すべて</option>
        <option value="2018-2">2018-2</option>
        <option value="2018-1">2018-1</option>
        <option value="2017-3">2017-3</option>
        <option value="2017-2">2017-2</option>
        <option value="2017-1">2017-1</option>
        <option value="2016-3">2016-3</option>
      </select>
    </div>
    <div class="control">
      <label for="modeFilter">出題モード</label>
      <select id="modeFilter">
        <option value="all">全問ランダム</option>
        <option value="review">間違えた問題だけ復習</option>
        <option value="unmastered">未正解の問題のみ</option>
      </select>
    </div>
  </section>

  <section class="panel question-panel" aria-live="polite">
    <div id="quizArea">
      <div class="question-meta">
        <span id="questionPosition">準備中</span>
        <span class="timer" id="timer">00秒</span>
      </div>
      <p class="question" id="questionText"></p>
      <div class="choices" id="choices"></div>
      <div class="feedback hidden" id="feedback">
        <div class="result" id="resultText"></div>
        <div class="translation" id="translation"></div>
        <h3>選択肢の意味</h3>
        <ul class="meaning-list" id="meaningList"></ul>
        <h3>解説</h3>
        <div class="explanation" id="explanation"></div>
      </div>
      <div class="actions">
        <button class="secondary hidden" id="skipBtn" type="button">この問題を飛ばす</button>
        <button class="primary" id="nextBtn" type="button" disabled>回答を選択</button>
      </div>
      <div class="hint" id="shortcutHint">PC：1〜4で回答 ／ Enter・Spaceで次の問題</div>
    </div>
    <div class="empty hidden" id="emptyState">
      <strong id="emptyTitle">対象の問題がありません</strong>
      <span id="emptyMessage">出題範囲またはモードを変更してください。</span>
    </div>
  </section>
</main>

<script>
/*
 * 問題データはこの配列に追加してください。
 * answer は 1〜4 の1始まりです（選択肢の番号と一致）。
 */
const QUESTIONS = [

{"id":"2016-3-01","session":"2016-3","number":1,"question":"Good dental (   ) is important, so most elementary schools have programs to teach children how to take care of their teeth.","choices":["grief","hygiene","pledge","static"],"answer":2,"translation":"歯の衛生は大切なので、ほとんどの小学校には子どもに歯の手入れの仕方を教えるプログラムがある。","choiceMeanings":["深い悲しみ","衛生","誓約","静的な"],"explanation":"dental hygiene(歯の衛生)が定番の組み合わせ。"},
{"id":"2016-3-02","session":"2016-3","number":2,"question":"A: Are those strange-looking berries (   )?\nB: Yes, they are. In fact, they taste delicious.","choices":["edible","inevitable","vicious","wicked"],"answer":1,"translation":"A:あの変わった見た目の実は食べられるの?\nB:うん、食べられるよ。実はおいしいんだ。","choiceMeanings":["食べられる","避けられない","悪意のある","邪悪な"],"explanation":"食べて味がおいしいと続くので「食用になる」edibleが適切。"},
{"id":"2016-3-03","session":"2016-3","number":3,"question":"When Aaron moved to Tokyo, he was completely (   ) by the subway system, but after a few weeks he understood it well enough to get around.","choices":["inflated","reconciled","bewildered","adored"],"answer":3,"translation":"アーロンは東京に引っ越したとき、地下鉄にすっかり戸惑ったが、数週間後には移動できる程度に理解した。","choiceMeanings":["膨らんだ","和解した","当惑した","崇拝された"],"explanation":"後半の「理解できた」と対比され、最初は複雑で「戸惑った」となる。"},
{"id":"2016-3-04","session":"2016-3","number":4,"question":"The doctor told Amanda her skin (   ) was caused by the soap she was using. After she switched to a new soap, her hands no longer became dry and red.","choices":["irritation","attendant","context","coherence"],"answer":1,"translation":"医師はアマンダに、肌の炎症は使っている石鹸が原因だと言った。新しい石鹸に替えると、手は乾燥したり赤くなったりしなくなった。","choiceMeanings":["炎症・刺激","付き添い人","文脈","一貫性"],"explanation":"skin irritation(肌荒れ・炎症)。手が乾燥して赤くなる症状に合う。"},
{"id":"2016-3-05","session":"2016-3","number":5,"question":"The windows in the apartment were (   ). In fact, it was almost impossible to see through them to the street outside.","choices":["filthy","cuddly","floppy","solitary"],"answer":1,"translation":"そのアパートの窓はとても汚かった。実際、窓越しに外の通りを見るのはほぼ不可能だった。","choiceMeanings":["不潔な・汚い","抱きしめたくなる","だらりとした","孤独な"],"explanation":"透けて見えない理由として「汚れている」filthyが適切。"},
{"id":"2016-3-06","session":"2016-3","number":6,"question":"The government is revising the tax law to close a (   ) that has allowed some people to avoid paying all the tax they should.","choices":["holdup","setback","loophole","downfall"],"answer":3,"translation":"政府は、一部の人が払うべき税金を全額払わずに済ませてきた抜け穴をふさぐため、税法を改正している。","choiceMeanings":["遅延・強盗","後退・挫折","抜け穴","没落"],"explanation":"tax loophole(税の抜け穴)。close a loopholeで「抜け穴をふさぐ」。"},
{"id":"2016-3-07","session":"2016-3","number":7,"question":"A: Erica beats me every time we play tennis. She's an outstanding player.\nB: Yeah, and she knows it, too. She's always (   ) about how good she is.","choices":["boasting","grumbling","kneading","wavering"],"answer":1,"translation":"A:エリカとテニスをすると毎回負けるよ。彼女は傑出した選手だ。\nB:うん、本人もそれを分かってる。いつも自分がいかに上手いか自慢してるよ。","choiceMeanings":["自慢している","不平を言っている","こねている","揺らいでいる"],"explanation":"boast about ~で「~を自慢する」。"},
{"id":"2016-3-08","session":"2016-3","number":8,"question":"Robert paid no (   ) to his doctor's warnings about his unhealthy lifestyle, continuing to smoke, drink, and eat junk food every day.","choices":["blister","heed","crumb","fluke"],"answer":2,"translation":"ロバートは不健康な生活習慣についての医師の警告に耳を貸さず、毎日タバコを吸い、酒を飲み、ジャンクフードを食べ続けた。","choiceMeanings":["水ぶくれ","注意","パンくず","まぐれ"],"explanation":"pay heed to ~で「~に注意を払う」。否定でno heedとなる。"},
{"id":"2016-3-09","session":"2016-3","number":9,"question":"With the nation facing a shortage of electricity, the government is (   ) plans to increase the number of wind and solar farms.","choices":["mystifying","trespassing","misplacing","accelerating"],"answer":4,"translation":"国が電力不足に直面する中、政府は風力・太陽光発電所を増やす計画を加速させている。","choiceMeanings":["煙に巻く","侵入する","置き忘れる","加速させる"],"explanation":"電力不足への対応として計画を「加速させる」が自然。"},
{"id":"2016-3-10","session":"2016-3","number":10,"question":"Donald often (   ) with anger when his co-workers disagreed with him. His boss warned him he would be fired if he could not keep his temper under control.","choices":["jumbled","revolved","wandered","erupted"],"answer":4,"translation":"ドナルドは同僚に反対されるとしばしば怒りを爆発させた。上司は、感情を抑えられなければ解雇すると警告した。","choiceMeanings":["ごちゃ混ぜになった","回転した","さまよった","爆発した"],"explanation":"erupt with anger(怒りを爆発させる)。"},
{"id":"2016-3-11","session":"2016-3","number":11,"question":"Most radio stations prefer to play only (   ) music, as many listeners would rather hear songs that are popular than those by lesser-known artists.","choices":["cowardly","mainstream","feeble","dutiful"],"answer":2,"translation":"ほとんどのラジオ局は主流の音楽だけを流したがる。多くのリスナーは無名アーティストより人気の曲を聴きたいからだ。","choiceMeanings":["臆病な","主流の","弱々しい","従順な"],"explanation":"「人気のある曲」=mainstream music。"},
{"id":"2016-3-12","session":"2016-3","number":12,"question":"A recent study of surgeons found a significant (   ) between age and knowledge of the latest surgical techniques. Younger surgeons seem to be much more familiar with new techniques.","choices":["reptile","summit","curse","correlation"],"answer":4,"translation":"外科医を対象とした最近の研究で、年齢と最新の手術技術の知識との間に有意な相関があることが分かった。若い外科医の方が新しい技術にずっと詳しいようだ。","choiceMeanings":["爬虫類","頂上","呪い","相関"],"explanation":"correlation between A and B「AとBの相関」。"},
{"id":"2016-3-13","session":"2016-3","number":13,"question":"The ancient Greeks believed Mount Olympus to be a (   ) place. They considered it to be the home of their gods.","choices":["petty","coarse","sacred","willing"],"answer":3,"translation":"古代ギリシャ人はオリンポス山を神聖な場所だと信じていた。そこを神々の住まいだと考えていたのだ。","choiceMeanings":["ささいな","粗い","神聖な","喜んで~する"],"explanation":"神々の住まいなので「神聖な」sacred。"},
{"id":"2016-3-14","session":"2016-3","number":14,"question":"A: James is so rude. Today, he walked right past me without saying hello.\nB: I'm sure he didn't do it (   ). He probably just didn't notice you.","choices":["intentionally","divinely","foolishly","brilliantly"],"answer":1,"translation":"A:ジェームズってほんと失礼。今日、挨拶もせずに私の前を通り過ぎたの。\nB:わざとじゃないと思うよ。たぶん気づかなかっただけだよ。","choiceMeanings":["わざと","神々しく","愚かに","見事に"],"explanation":"「気づかなかっただけ」→「わざとではない」。"},
{"id":"2016-3-15","session":"2016-3","number":15,"question":"The factory was forced to close down when authorities discovered that it had been (   ) harmful chemicals into the atmosphere.","choices":["emitting","appointing","restating","instigating"],"answer":1,"translation":"当局が工場が有害な化学物質を大気中に排出していたことを発見し、その工場は閉鎖を余儀なくされた。","choiceMeanings":["排出する","任命する","言い直す","扇動する"],"explanation":"emit ~ into the atmosphere(~を大気中に排出する)。"},
{"id":"2016-3-16","session":"2016-3","number":16,"question":"The doctor said Marlene's diet was (   ) in iron and other minerals, and that this was causing her to tire easily and have poor health.","choices":["transparent","deficient","modified","pessimistic"],"answer":2,"translation":"医師は、マーリーンの食事は鉄分などのミネラルが不足しており、それが疲れやすさや健康不良の原因だと言った。","choiceMeanings":["透明な","不足した","修正された","悲観的な"],"explanation":"deficient in ~で「~が不足している」。"},
{"id":"2016-3-17","session":"2016-3","number":17,"question":"After one of the airplane's engines failed, it began to lose (   ) rapidly and had to make an emergency landing.","choices":["procedure","altitude","expertise","trickery"],"answer":2,"translation":"エンジンの1つが故障した後、その飛行機は急速に高度を失い始め、緊急着陸しなければならなかった。","choiceMeanings":["手順","高度","専門知識","ごまかし"],"explanation":"lose altitude(高度を失う)は飛行機の定番表現。"},
{"id":"2016-3-18","session":"2016-3","number":18,"question":"Although the novel was written more than a hundred years ago, readers today will probably be surprised at how (   ) the characters seem.","choices":["contemporary","tremendous","sinister","simultaneous"],"answer":1,"translation":"その小説は100年以上前に書かれたが、現代の読者は登場人物がいかに現代的に思えるかに驚くだろう。","choiceMeanings":["現代の","途方もない","不吉な","同時の"],"explanation":"100年前の作品なのに驚く→「現代的な」contemporary。"},
{"id":"2016-3-19","session":"2016-3","number":19,"question":"The country was on high alert for terrorism, so four extra police cars (   ) the visiting prime minister from the airport to his hotel.","choices":["carved","scattered","escorted","restructured"],"answer":3,"translation":"その国はテロへの高い警戒態勢にあったため、4台の追加のパトカーが訪問中の首相を空港からホテルまで護衛した。","choiceMeanings":["彫った","まき散らした","護衛した","再編成した"],"explanation":"escort ~ from A to B「~をAからBまで護衛する」。"},
{"id":"2016-3-20","session":"2016-3","number":20,"question":"Some of Professor Kimble's co-workers at the university consider teaching to be a duty, but she thinks of it as a (   ). She feels honored to help young people learn.","choices":["component","boundary","privilege","pillar"],"answer":3,"translation":"大学のキンブル教授の同僚の中には教えることを義務と考える人もいるが、彼女はそれを特権だと思っている。若者の学びを助けることを光栄に感じている。","choiceMeanings":["構成要素","境界","特権","柱"],"explanation":"duty(義務)と対比され、honoredと呼応するのはprivilege。"},
{"id":"2016-3-21","session":"2016-3","number":21,"question":"After his mother became seriously ill, David had to (   ) his plans to go to college so that he could look after her.","choices":["dread","emulate","mingle","abandon"],"answer":4,"translation":"母親が重病になった後、デイビッドは母の世話をするために大学進学の計画を断念しなければならなかった。","choiceMeanings":["恐れる","見習う","交じる","断念する"],"explanation":"世話のために計画を「あきらめる」abandon。"},
{"id":"2016-3-22","session":"2016-3","number":22,"question":"As the demonstration in the capital grew, the government began to worry that it would (   ) a revolution, so the army was sent to stop it.","choices":["fall for","bring on","lay off","break down"],"answer":2,"translation":"首都でのデモが拡大するにつれ、政府はそれが革命を引き起こすのではと心配し始め、鎮圧のため軍が派遣された。","choiceMeanings":["~にだまされる","~を引き起こす","~を一時解雇する","故障する"],"explanation":"bring on ~は「~をもたらす・引き起こす」。"},
{"id":"2016-3-23","session":"2016-3","number":23,"question":"Some of the team members thought they would need more time to finish the project, but in the end they decided to (   ) their original plan to finish by June.","choices":["stick with","split up","drive off","pin down"],"answer":1,"translation":"チームメンバーの一部はプロジェクトを終えるのにもっと時間が必要だと考えたが、結局6月までに終えるという当初の計画を貫くことにした。","choiceMeanings":["~を貫く・固守する","分裂する","~を追い払う","~を特定する"],"explanation":"stick with ~で「~を続ける・守る」。"},
{"id":"2016-3-24","session":"2016-3","number":24,"question":"When the founder retired, he (   ) control of the company to the vice president until his son was old enough to become CEO himself.","choices":["talked up","tracked down","gave over","took on"],"answer":3,"translation":"創業者は引退するとき、息子が自分でCEOになれる年齢になるまで、会社の経営権を副社長に譲り渡した。","choiceMeanings":["~を誇張して話す","~を追跡して見つける","~を譲り渡す","~を引き受ける"],"explanation":"give over ~ to ...で「~を…に引き渡す」。"},
{"id":"2016-3-25","session":"2016-3","number":25,"question":"Paulo found it hard to handle the cold weather when he lived in Alaska. Every year, winter (   ) around September, and it would remain cold until May.","choices":["tied up","set in","let up","picked over"],"answer":2,"translation":"パウロはアラスカに住んでいたとき、寒さに対処するのが大変だった。毎年9月ごろに冬が始まり、5月まで寒いままだった。","choiceMeanings":["~を縛る","(季節などが)始まる","弱まる","~を選び出す"],"explanation":"winter sets in(冬が到来する)。"},
{"id":"2017-1-01","session":"2017-1","number":1,"question":"A: Mary, it was really (   ) of you to notice that mistake in the report. Everyone else missed it.\nB: Thanks, Kazu. I've been trying to pay more attention to small details recently.","choices":["humble","impulsive","desperate","observant"],"answer":4,"translation":"A:メアリー、報告書のあの間違いに気づくなんて本当に観察力があるね。他の皆は見逃してたよ。\nB:ありがとう、カズ。最近、細部にもっと注意を払うようにしているの。","choiceMeanings":["謙虚な","衝動的な","必死の","観察力のある"],"explanation":"細部に注意して間違いに気づいた→observant。"},
{"id":"2017-1-02","session":"2017-1","number":2,"question":"When Elsa first opened her store, it did not make much money, but it soon began to (   ). She is now considering opening a second branch.","choices":["prosper","formulate","proclaim","lodge"],"answer":1,"translation":"エルサが最初に店を開いたときはあまり儲からなかったが、すぐに繁盛し始めた。彼女は今、2号店の開店を検討している。","choiceMeanings":["繁盛する","明確に述べる","宣言する","宿泊する"],"explanation":"2号店を考えるほどなので「繁盛する」prosper。"},
{"id":"2017-1-03","session":"2017-1","number":3,"question":"After meeting with the CEO of a company hoping to construct a factory in the town, the mayor decided to hold a public meeting to get residents' (   ) on the plan.","choices":["perspective","disposal","archive","subsistence"],"answer":1,"translation":"町に工場を建設したい企業のCEOと会った後、市長は計画について住民の意見を聞くため公開集会を開くことにした。","choiceMeanings":["見方・意見","処分","記録保管所","生存"],"explanation":"residents' perspective on the plan(計画についての住民の見方)。"},
{"id":"2017-1-04","session":"2017-1","number":4,"question":"The cows were (   ) peacefully in the meadow. They were so focused on eating that they did not even look up as the farmer walked past.","choices":["gliding","grazing","grooming","glancing"],"answer":2,"translation":"牛たちは牧草地で平和に草を食んでいた。食べることに集中するあまり、農夫が通り過ぎても顔を上げなかった。","choiceMeanings":["滑るように進む","草を食む","身づくろいする","ちらっと見る"],"explanation":"cows + meadow + eating → graze(草を食む)。"},
{"id":"2017-1","session":"2017-1","number":5,"question":"Critics agreed the author's first novel was the most (   ) to have appeared for years. It had a complex and original plot with unique characters.","choices":["unconscious","immaterial","unreasonable","inventive"],"answer":4,"translation":"批評家たちは、その作家の処女小説が近年登場した中で最も独創的だと意見が一致した。複雑で独創的な筋書きと個性的な登場人物があった。","choiceMeanings":["無意識の","重要でない","理不尽な","独創的な"],"explanation":"original plot, unique charactersの説明に合うのはinventive。"},
{"id":"2017-1-06","session":"2017-1","number":6,"question":"Some traditions in Japan have disappeared, but taking off one's shoes at the entrance of homes is still (   ).","choices":["prevalent","trivial","savage","arrogant"],"answer":1,"translation":"日本の伝統の中には消えたものもあるが、家の玄関で靴を脱ぐ習慣は今でも広く行われている。","choiceMeanings":["広く行きわたった","ささいな","野蛮な","傲慢な"],"explanation":"習慣が今も広く残っている→prevalent。"},
{"id":"2017-1-07","session":"2017-1","number":7,"question":"After Ed went to Brazil to do research, he wrote his sister a letter every week. Their (   ) was interrupted, however, when Ed made trips to the jungle and could not send any mail.","choices":["validity","correspondence","imbalance","mercy"],"answer":2,"translation":"エドは調査のためブラジルへ行った後、毎週姉に手紙を書いた。しかしエドがジャングルへ出かけて郵便を送れなくなると、2人の文通は途絶えた。","choiceMeanings":["妥当性","文通","不均衡","慈悲"],"explanation":"letterのやり取り=correspondence。"},
{"id":"2017-1-08","session":"2017-1","number":8,"question":"As well as their weapons and other equipment, the soldiers had to carry two weeks' supply of (   ). The extra food made their packs heavier than usual.","choices":["encounters","sacrifices","rations","junctions"],"answer":3,"translation":"武器やその他の装備に加え、兵士たちは2週間分の食料を運ばなければならなかった。余分な食料のせいで荷物がいつもより重くなった。","choiceMeanings":["遭遇","犠牲","(配給の)食料","合流点"],"explanation":"extra foodと言い換えられているのでrations(携行食料)。"},
{"id":"2017-1-09","session":"2017-1","number":9,"question":"A: Elena, the weather forecast says it will rain today, so maybe we should do some gardening another day.\nB: It's only supposed to rain (   ), honey. Let's just do as much as we can before it starts.","choices":["solemnly","courteously","intermittently","recklessly"],"answer":3,"translation":"A:エレナ、天気予報だと今日は雨みたいだから、ガーデニングは別の日にした方がいいかもね。\nB:雨は断続的に降るだけのはずよ。降り出す前にできるだけやりましょう。","choiceMeanings":["厳粛に","礼儀正しく","断続的に","無謀に"],"explanation":"rain intermittently(雨が断続的に降る)。"},
{"id":"2017-1-10","session":"2017-1","number":10,"question":"Mark was pleased when his company (   ) his ideas into its latest software package. He felt he had finally made a significant contribution to the company.","choices":["mediated","adhered","fabricated","incorporated"],"answer":4,"translation":"会社が彼のアイデアを最新のソフトウェアパッケージに取り入れたとき、マークは喜んだ。ついに会社に大きく貢献できたと感じた。","choiceMeanings":["仲介した","固執した","捏造した","組み入れた"],"explanation":"incorporate A into B「AをBに組み込む」。"},
{"id":"2017-1-11","session":"2017-1","number":11,"question":"The principal told the schoolchildren that if they did not (   ) with the school rules they would be punished.","choices":["comply","conspire","rebound","replicate"],"answer":1,"translation":"校長は、校則に従わなければ罰せられると生徒たちに告げた。","choiceMeanings":["従う","共謀する","跳ね返る","複製する"],"explanation":"comply with ~「~に従う」。"},
{"id":"2017-1-12","session":"2017-1","number":12,"question":"As part of a peace plan, the two nations have ordered their armies to leave the region. The troops will begin to (   ) immediately.","choices":["grant","strangle","withdraw","ignite"],"answer":3,"translation":"和平計画の一環として、両国は軍に地域から離れるよう命じた。部隊は直ちに撤退を始める。","choiceMeanings":["与える","絞め殺す","撤退する","点火する"],"explanation":"leave the regionの言い換えでwithdraw(撤退)。"},
{"id":"2017-1-13","session":"2017-1","number":13,"question":"A: How many (   ) do you have?\nB: We're a big family. I have three brothers and one sister.","choices":["apprentices","siblings","peasants","referees"],"answer":2,"translation":"A:きょうだいは何人いるの?\nB:大家族なんだ。兄弟が3人と姉妹が1人いるよ。","choiceMeanings":["見習い","きょうだい","小作農","審判"],"explanation":"brothers and sisterの総称がsiblings。"},
{"id":"2017-1-14","session":"2017-1","number":14,"question":"For years, (   ) at the college had been declining, but last year the number of freshmen suddenly increased.","choices":["excavation","meditation","alignment","enrollment"],"answer":4,"translation":"長年、その大学の入学者数は減少していたが、昨年は新入生の数が突然増えた。","choiceMeanings":["発掘","瞑想","整列","入学者数"],"explanation":"freshmenの数に関わるのでenrollment。"},
{"id":"2017-1-15","session":"2017-1","number":15,"question":"The airline representative told us not to (   ) our baggage-claim tickets, as we would need them when we arrived at our destination.","choices":["endorse","discard","exert","magnify"],"answer":2,"translation":"航空会社の係員は、目的地に着いたときに必要になるので、手荷物引換券を捨てないようにと私たちに言った。","choiceMeanings":["承認する","捨てる","行使する","拡大する"],"explanation":"後で必要になるのでdiscard(捨てる)なと言われる。"},
{"id":"2017-1-16","session":"2017-1","number":16,"question":"Being a surgeon requires (   ). One tiny mistake during surgery can put the patient's life at risk.","choices":["disarray","permanence","friction","precision"],"answer":4,"translation":"外科医であることには精密さが求められる。手術中のわずかなミスでも患者の命を危険にさらしかねない。","choiceMeanings":["混乱","永続性","摩擦","正確さ"],"explanation":"小さなミスが命に関わる→precision。"},
{"id":"2017-1-17","session":"2017-1","number":17,"question":"The thief (   ) the shop cashier by telling her that if she did not give him the money in the cash register, he would shoot her.","choices":["signified","threatened","witnessed","soaked"],"answer":2,"translation":"泥棒は、レジのお金を渡さなければ撃つと言って店のレジ係を脅した。","choiceMeanings":["意味した","脅した","目撃した","浸した"],"explanation":"撃つと言って金を要求→threaten(脅す)。"},
{"id":"2017-1-18","session":"2017-1","number":18,"question":"A: Mom, I knocked the vase off the table and broke it. Sorry!\nB: Jenny, you're so (   )! That's the second thing you've broken this week.","choices":["clumsy","rigid","nosy","sober"],"answer":1,"translation":"A:ママ、花瓶をテーブルから落として割っちゃった。ごめんなさい!\nB:ジェニー、あなたって本当に不器用ね!今週2つ目よ、壊したのは。","choiceMeanings":["不器用な","堅い","詮索好きな","しらふの"],"explanation":"物を壊してばかり→clumsy。"},
{"id":"2017-1-19","session":"2017-1","number":19,"question":"The student's (   ) to improving his grades was impressive. He spent hours studying in the library and often asked his teachers for extra homework.","choices":["dedication","tariff","stiffness","blockade"],"answer":1,"translation":"成績向上に向けたその生徒の献身ぶりは印象的だった。図書館で何時間も勉強し、しばしば先生に追加の宿題を頼んだ。","choiceMeanings":["献身","関税","堅さ","封鎖"],"explanation":"dedication to ~「~への献身」。"},
{"id":"2017-1-20","session":"2017-1","number":20,"question":"Thousands of kilograms of beef were taken off store shelves after it was discovered that the meat was (   ) with dangerous bacteria.","choices":["entitled","illustrated","contaminated","suppressed"],"answer":3,"translation":"肉が危険な細菌に汚染されていることが分かり、数千キロの牛肉が店の棚から撤去された。","choiceMeanings":["資格を与えられた","図解された","汚染された","抑圧された"],"explanation":"contaminated with ~「~で汚染された」。"},
{"id":"2017-1-21","session":"2017-1","number":21,"question":"The man claims that the company stole his idea for the best-selling product. He has hired a lawyer and intends to (   ) the company.","choices":["crawl","tame","sue","twist"],"answer":3,"translation":"その男は、会社がベストセラー商品のアイデアを盗んだと主張している。弁護士を雇い、会社を訴えるつもりだ。","choiceMeanings":["這う","飼いならす","訴える","ひねる"],"explanation":"弁護士を雇う文脈→sue(訴える)。"},
{"id":"2017-1-22","session":"2017-1","number":22,"question":"Last year's crop harvest was very poor. Then, sickness spread through the town during an unusually cold winter. All of this (   ) a difficult situation for the local people.","choices":["looked down on","added up to","fell back on","got on with"],"answer":2,"translation":"昨年の作物の収穫は非常に悪かった。その後、異常に寒い冬に町に病気が広がった。これらすべてが地元の人々にとって困難な状況になった。","choiceMeanings":["~を見下した","結局~になった","~に頼った","~と仲良くやった"],"explanation":"add up to ~は「合計~になる、結局~になる」。"},
{"id":"2017-1-23","session":"2017-1","number":23,"question":"Gracie saw a stranger (   ) in front of her house, so she called the police. However, the man was actually just waiting for a friend.","choices":["hanging around","settling up","backing down","holding off"],"answer":1,"translation":"グレイシーは家の前を見知らぬ人がうろついているのを見て警察に通報した。しかし、その男は実際には友人を待っていただけだった。","choiceMeanings":["うろつく","清算する","引き下がる","延期する"],"explanation":"hang around(うろつく)。怪しい人物の描写。"},
{"id":"2017-1-24","session":"2017-1","number":24,"question":"The chemical company tried to (   ) the negative effects its new factory would have on the environment, but local people remained very concerned.","choices":["drop back","jump at","face off","play down"],"answer":4,"translation":"その化学会社は新工場が環境に与える悪影響を軽く見せようとしたが、地元の人々は依然として大いに懸念していた。","choiceMeanings":["後退する","~に飛びつく","対決する","~を軽視する・控えめに言う"],"explanation":"but以下と対比され、悪影響を「小さく見せる」play down。"},
{"id":"2017-1-25","session":"2017-1","number":25,"question":"A: Henry, what do the employees in your section think about the new sales plan?\nB: Well, I can't (   ) the other team members, but I think it looks fine.","choices":["read off","hand off","speak for","weigh on"],"answer":3,"translation":"A:ヘンリー、君の部署の従業員は新しい販売計画をどう思っている?\nB:他のメンバーの代弁はできないけど、僕はいいと思うよ。","choiceMeanings":["~を読み上げる","~を引き渡す","~を代弁する","~の重荷になる"],"explanation":"speak for ~は「~の代弁をする」。"},
{"id":"2017-2-01","session":"2017-2","number":1,"question":"Rumors (   ) as to why the movie-star couple suddenly got divorced, but no one seems to know for certain.","choices":["expire","depart","groan","abound"],"answer":4,"translation":"映画スター夫妻がなぜ突然離婚したかについて噂が溢れているが、確かなことは誰も知らないようだ。","choiceMeanings":["期限が切れる","出発する","うめく","たくさんある"],"explanation":"Rumors abound(噂が飛び交う)。"},
{"id":"2017-2-02","session":"2017-2","number":2,"question":"Support for the prime minister had been dropping, but he received a (   ) in public-opinion surveys when the economy began to improve.","choices":["boost","ditch","shield","feast"],"answer":1,"translation":"首相への支持は下がっていたが、経済が上向き始めると世論調査で支持が上昇した。","choiceMeanings":["押し上げ","溝","盾","宴会"],"explanation":"receive a boost(後押し・上昇を得る)。"},
{"id":"2017-2-03","session":"2017-2","number":3,"question":"The country has experienced crop failures for two years in a row. Aid agencies warn that the resulting food shortages could lead to widespread (   ).","choices":["prologue","insight","famine","heritage"],"answer":3,"translation":"その国は2年連続で不作に見舞われた。援助機関は、その結果の食糧不足が広範な飢饉につながりかねないと警告している。","choiceMeanings":["序章","洞察","飢饉","遺産"],"explanation":"crop failures, food shortages → famine。"},
{"id":"2017-2-04","session":"2017-2","number":4,"question":"Mark received his university (   ) two months after graduation. He framed it and hung it on the wall of his room.","choices":["diploma","orbit","capital","faculty"],"answer":1,"translation":"マークは卒業の2か月後に大学の卒業証書を受け取った。彼はそれを額に入れて部屋の壁に掛けた。","choiceMeanings":["卒業証書","軌道","首都・資本","学部・教員"],"explanation":"graduation後に受け取り額に入れる→diploma。"},
{"id":"2017-2-05","session":"2017-2","number":5,"question":"The company's computer system was (   ) by one technical problem after another. Finally, the president decided to have it replaced.","choices":["penalized","retrieved","plagued","ripened"],"answer":3,"translation":"その会社のコンピューターシステムは次々と技術的問題に悩まされた。ついに社長はそれを入れ替えることにした。","choiceMeanings":["罰せられた","取り戻された","悩まされた","熟した"],"explanation":"be plagued by ~「~に苦しめられる」。"},
{"id":"2017-2-06","session":"2017-2","number":6,"question":"The museum had a (   ) collection of objects donated by local people over the years. A few of them were rare and expensive, but most of them were quite ordinary things.","choices":["miscellaneous","sweltering","thunderous","dejected"],"answer":1,"translation":"その博物館には、長年にわたり地元の人々から寄贈された雑多な収集品があった。珍しく高価なものも少しあったが、大半はごく普通の物だった。","choiceMeanings":["雑多な","うだるように暑い","雷のような","落胆した"],"explanation":"珍しいものから普通のものまで混在→miscellaneous。"},
{"id":"2017-2-07","session":"2017-2","number":7,"question":"The new president believes (   ) world peace can be achieved. \"Humans have the potential to prevent all wars in the future,\" he said.","choices":["perpetual","brutal","gloomy","prior"],"answer":1,"translation":"新大統領は恒久的な世界平和は実現できると信じている。「人類には将来すべての戦争を防ぐ可能性がある」と彼は述べた。","choiceMeanings":["恒久的な","残忍な","憂鬱な","事前の"],"explanation":"perpetual peace(恒久平和)。"},
{"id":"2017-2-08","session":"2017-2","number":8,"question":"The explorers decided to (   ) for the night, make camp, and continue their journey the next morning.","choices":["tumble","task","halt","beckon"],"answer":3,"translation":"探検家たちは夜は停止して野営し、翌朝に旅を続けることにした。","choiceMeanings":["転ぶ","課題を課す","止まる","手招きする"],"explanation":"halt for the night(夜のために止まる)。"},
{"id":"2017-2-09","session":"2017-2","number":9,"question":"So many farmers (   ) water from the local river to their fields that the river often becomes dry during the summer months.","choices":["divert","resent","enlarge","renounce"],"answer":1,"translation":"あまりに多くの農家が地元の川から畑へ水を引くので、夏の間その川はしばしば干上がる。","choiceMeanings":["(流れを)そらす・引く","憤る","拡大する","放棄する"],"explanation":"divert water from ~ to ...(水を~から…へ転用する)。"},
{"id":"2017-2-10","session":"2017-2","number":10,"question":"Permanent positions at some companies are becoming increasingly (   ). Instead, temporary workers are being used in an attempt to save money.","choices":["fussy","villainous","scarce","adolescent"],"answer":3,"translation":"一部の企業では正社員のポストがますます少なくなっている。代わりに、節約のため臨時の労働者が使われている。","choiceMeanings":["気難しい","悪党のような","乏しい","青年期の"],"explanation":"Insteadで臨時雇用に移行→正規の職は「少ない」。"},
{"id":"2017-2-11","session":"2017-2","number":11,"question":"The child's parents were extremely (   ). They rarely punished him for any kind of bad behavior.","choices":["forward","lenient","fierce","grand"],"answer":2,"translation":"その子の両親は非常に寛大だった。どんな悪い行いをしても、ほとんど罰しなかった。","choiceMeanings":["前方の","寛大な","凶暴な","壮大な"],"explanation":"rarely punished → lenient(甘い・寛大な)。"},
{"id":"2017-2-12","session":"2017-2","number":12,"question":"Journalists need to be (   ). Sometimes people do not want to talk to a reporter, so it is necessary to request an interview many times before they say yes.","choices":["persistent","superstitious","muddy","sane"],"answer":1,"translation":"ジャーナリストは粘り強くなければならない。取材を嫌がる人もいるので、承諾してもらうまで何度も依頼する必要がある。","choiceMeanings":["粘り強い","迷信深い","泥だらけの","正気の"],"explanation":"何度も依頼する→persistent。"},
{"id":"2017-2-13","session":"2017-2","number":13,"question":"The protesters were removed from the city hall building for (   ) the event. They had been shouting so loudly that no one could hear the speeches.","choices":["rotating","fostering","wounding","disrupting"],"answer":4,"translation":"抗議者たちはイベントを妨害したため市庁舎から退去させられた。大声で叫んでいたせいで誰も演説を聞けなかった。","choiceMeanings":["回転させる","育てる","傷つける","妨害する"],"explanation":"演説が聞こえない→イベントをdisrupt(妨害)。"},
{"id":"2017-2-14","session":"2017-2","number":14,"question":"The novel was so popular with teenagers that a movie was made based on the story. This (   ), however, proved to be much less popular.","choices":["adaptation","contemplation","institution","coalition"],"answer":1,"translation":"その小説は10代に大人気だったため、物語を基にした映画が作られた。しかしこの翻案作品ははるかに人気が劣ることが分かった。","choiceMeanings":["翻案作品","熟考","施設・制度","連合"],"explanation":"小説を基にした映画=adaptation。"},
{"id":"2017-2-15","session":"2017-2","number":15,"question":"After spending two hours trying unsuccessfully to repair his bicycle's brakes, Leo got so (   ) that he threw his tools at the wall of his garage.","choices":["pursued","concealed","prolonged","frustrated"],"answer":4,"translation":"自転車のブレーキを2時間直そうとして失敗した後、レオはひどくいらだち、工具をガレージの壁に投げつけた。","choiceMeanings":["追われた","隠された","長引いた","いらだった"],"explanation":"修理失敗で道具を投げる→frustrated。"},
{"id":"2017-2-16","session":"2017-2","number":16,"question":"A: Hi, Professor Jones. You're looking very nice in that suit today.\nB: Thank you, Jim. But don't think (   ) will get you a better grade on your report!","choices":["formation","intimidation","flattery","proficiency"],"answer":3,"translation":"A:こんにちは、ジョーンズ教授。今日はそのスーツがとてもお似合いですね。\nB:ありがとう、ジム。でもお世辞でレポートの成績が良くなるとは思わないでね!","choiceMeanings":["形成","脅し","お世辞","熟練"],"explanation":"服を褒めて成績を狙う→flattery。"},
{"id":"2017-2-17","session":"2017-2","number":17,"question":"The coffee table that Giovanna bought was too (   ) to fit in the trunk of her car, so she had to ask the shop to deliver it to her home.","choices":["lean","bulky","impaired","predictable"],"answer":2,"translation":"ジョバンナが買ったコーヒーテーブルは大きすぎて車のトランクに入らなかったので、店に自宅への配送を頼まなければならなかった。","choiceMeanings":["やせた","かさばる","損なわれた","予測可能な"],"explanation":"トランクに入らない→bulky。"},
{"id":"2017-2-18","session":"2017-2","number":18,"question":"Although the building was only (   ) destroyed in the fire, the owners decided to take it down completely and build a new one in its place.","choices":["mutually","partially","manually","regretfully"],"answer":2,"translation":"建物は火事で部分的にしか壊れなかったが、所有者は完全に取り壊してその場所に新しい建物を建てることにした。","choiceMeanings":["相互に","部分的に","手作業で","残念ながら"],"explanation":"completelyと対比→partially。"},
{"id":"2017-2-19","session":"2017-2","number":19,"question":"Many charities receive tax (   ) from the government. Since they do not have to pay taxes, they have more money to spend on helping society.","choices":["diagrams","treaties","exemptions","mechanisms"],"answer":3,"translation":"多くの慈善団体は政府から税の免除を受けている。税金を払う必要がないので、社会を助けるために使える資金が多くなる。","choiceMeanings":["図表","条約","免除","仕組み"],"explanation":"tax exemption(免税)。"},
{"id":"2017-2-20","session":"2017-2","number":20,"question":"Therapists believe it is important for patients to (   ) their problems. If patients keep saying that nothing is wrong, it is unlikely they will get better.","choices":["acknowledge","disguise","compress","yield"],"answer":1,"translation":"セラピストは、患者が自分の問題を認めることが重要だと考えている。何も問題ないと言い続ける患者は回復しそうにない。","choiceMeanings":["認める","偽る","圧縮する","生み出す"],"explanation":"nothing is wrongと言い続けるのと対比→acknowledge。"},
{"id":"2017-2-21","session":"2017-2","number":21,"question":"Although the actor usually (   ) tough gangsters in films, in real life he is a kind and gentle man.","choices":["simplifies","hovers","portrays","verifies"],"answer":3,"translation":"その俳優は映画ではたいてい強面のギャングを演じているが、実生活では優しく穏やかな人だ。","choiceMeanings":["単純化する","空中に浮かぶ","演じる・描く","確かめる"],"explanation":"portray(役を演じる)。"},
{"id":"2017-2-22","session":"2017-2","number":22,"question":"After the biggest company in the town closed down, many workers lost their jobs. However, the local economy has (   ) recently, and employment is steady.","choices":["given in","bounced back","stood down","wrapped up"],"answer":2,"translation":"町最大の企業が閉鎖した後、多くの労働者が職を失った。しかし最近は地域経済が回復し、雇用は安定している。","choiceMeanings":["屈した","回復した","退いた","終えた"],"explanation":"bounce back(立ち直る)。"},
{"id":"2017-2-23","session":"2017-2","number":23,"question":"The online music video was popular at first, but the number of viewers soon began to (   ), and most people had forgotten about it within a couple of months.","choices":["fall off","trip up","sit in","try out"],"answer":1,"translation":"そのオンラインのミュージックビデオは最初は人気だったが、視聴者数はすぐに減り始め、数か月でほとんどの人が忘れていた。","choiceMeanings":["減少する","つまずく","見学する","試す"],"explanation":"fall off(減る)。"},
{"id":"2017-2-24","session":"2017-2","number":24,"question":"A: This party is fun, but we'd better (   ) soon.\nB: You're right. We don't want to miss the last train home.","choices":["drag on","play out","wash away","head out"],"answer":4,"translation":"A:このパーティーは楽しいけど、そろそろ出発した方がいいね。\nB:そうだね。終電を逃したくないし。","choiceMeanings":["だらだら続く","展開する","洗い流す","出発する"],"explanation":"終電を逃さないために「出発する」head out。"},
{"id":"2017-2-25","session":"2017-2","number":25,"question":"When the new owners bought the restaurant, they changed a lot of things. They decorated the dining room, made a new menu, and even (   ) a new kitchen.","choices":["set off","took up","brought off","put in"],"answer":4,"translation":"新しいオーナーがレストランを買い取ると、多くを変えた。食堂を飾り付け、新メニューを作り、新しい厨房まで設置した。","choiceMeanings":["出発する・爆発させる","~を始める","~をやり遂げる","~を設置する"],"explanation":"put in a kitchen(設備を取り付ける)。"},
{"id":"2017-3-01","session":"2017-3","number":1,"question":"Some Olympic athletes complain their sports do not receive any media (   ). However, the large number of events makes reporting on all of them impossible.","choices":["fusion","coverage","nonsense","retreat"],"answer":2,"translation":"オリンピック選手の中には、自分の競技がメディアで全く取り上げられないと不満を言う者もいる。しかし競技数が多いので、すべてを報道するのは不可能だ。","choiceMeanings":["融合","報道","ナンセンス","撤退"],"explanation":"media coverage(報道)。"},
{"id":"2017-3-02","session":"2017-3","number":2,"question":"Please (   ) the lower half of the form and send it with your payment in the enclosed envelope. Keep the upper half for your reference.","choices":["degrade","deprive","detach","decline"],"answer":3,"translation":"用紙の下半分を切り離し、同封の封筒で支払いと一緒に送ってください。上半分は参考用に保管してください。","choiceMeanings":["品位を下げる","奪う","切り離す","断る"],"explanation":"用紙の半分を切り取る→detach。"},
{"id":"2017-3-03","session":"2017-3","number":3,"question":"As a former construction company president, the mayor was (   ) in choosing the members of the city council. He mainly selected people who had ties to the industry.","choices":["tolerant","classified","vacant","biased"],"answer":4,"translation":"元建設会社の社長として、市長は市議会議員の選任で偏っていた。彼は主に業界とつながりのある人を選んだ。","choiceMeanings":["寛容な","機密の","空いている","偏った"],"explanation":"業界関係者ばかり選ぶ→biased。"},
{"id":"2017-3-04","session":"2017-3","number":4,"question":"After the company announced more pay cuts, the supervisor could not remain (   ) about the way workers were being treated. At the next union meeting, he suggested going on strike.","choices":["legitimate","aggressive","furious","indifferent"],"answer":4,"translation":"会社がさらなる賃金カットを発表した後、その上司は労働者の扱われ方に無関心でいられなくなった。次の組合集会で、彼はストライキを提案した。","choiceMeanings":["合法の","攻撃的な","激怒した","無関心な"],"explanation":"could not remain indifferent about ~「~に無関心でいられない」。"},
{"id":"2017-3-05","session":"2017-3","number":5,"question":"A: That sure is a big (   ) of food on your plate, Sam! You must be hungry.\nB: I am, Lynn. I didn't eat breakfast, and I just finished working out at the gym.","choices":["heap","flaw","nuance","sequel"],"answer":1,"translation":"A:サム、お皿の食べ物すごい山盛りね!お腹ペコペコなんでしょ。\nB:そうなんだ、リン。朝食を抜いて、ジムで運動したところなんだ。","choiceMeanings":["山","欠陥","ニュアンス","続編"],"explanation":"a heap of ~(山盛りの~)。"},
{"id":"2017-3-06","session":"2017-3","number":6,"question":"The teacher asked the boy nicely to (   ) from chewing gum in class several times. When he refused to stop, the teacher sent him to the principal's office.","choices":["refrain","enforce","scold","curb"],"answer":1,"translation":"先生は授業中にガムを噛むのを控えるよう、その少年に何度も丁寧に頼んだ。彼がやめようとしないので、先生は校長室へ行かせた。","choiceMeanings":["控える","強制する","叱る","抑制する"],"explanation":"refrain from -ing「~を控える」。"},
{"id":"2017-3-07","session":"2017-3","number":7,"question":"The little girl stood up and made a speech, but her voice was so (   ) that most people in the audience could not hear what she was saying.","choices":["dense","ethical","harsh","faint"],"answer":4,"translation":"少女は立ち上がってスピーチをしたが、声がとてもかすかで、聴衆のほとんどは彼女の言葉が聞こえなかった。","choiceMeanings":["密集した","倫理的な","耳障りな","かすかな"],"explanation":"聞こえない声→faint。"},
{"id":"2017-3-08","session":"2017-3","number":8,"question":"In some cultures it is (   ) to ask how much money someone makes. In fact, the topic of personal finances in general should be avoided in conversation.","choices":["integral","finite","improper","desirable"],"answer":3,"translation":"文化によっては、人がいくら稼いでいるかを尋ねるのは不適切だ。実際、個人の資産についての話題は会話全般で避けるべきだ。","choiceMeanings":["不可欠な","有限の","不適切な","望ましい"],"explanation":"avoidedとあるのでimproper。"},
{"id":"2017-3-09","session":"2017-3","number":9,"question":"The presidential candidate came from a wealthy family. This hurt his popularity among the poor, who felt his (   ) prevented him from understanding their economic troubles.","choices":["pharmacy","upbringing","conquest","spectacle"],"answer":2,"translation":"その大統領候補は裕福な家庭の出身だった。これは貧しい人々の間での人気を損ない、彼らは彼の生い立ちが自分たちの経済的苦境の理解を妨げていると感じた。","choiceMeanings":["薬局","生い立ち","征服","光景"],"explanation":"wealthy familyに関わるのでupbringing。"},
{"id":"2017-3-10","session":"2017-3","number":10,"question":"During his summer vacation, Frank visited a small tropical island to relax. Having come straight from the loud, busy city, he enjoyed the island's (   ) atmosphere.","choices":["serene","charitable","eerie","fatal"],"answer":1,"translation":"夏休みにフランクはリラックスするため小さな熱帯の島を訪れた。騒がしく忙しい都会から直接来た彼は、島の穏やかな雰囲気を楽しんだ。","choiceMeanings":["穏やかな","慈悲深い","不気味な","致命的な"],"explanation":"loud, busyと対比→serene。"},
{"id":"2017-3-11","session":"2017-3","number":11,"question":"A: Erica, do you want to go out and eat Chinese food tonight?\nB: I love Chinese food, so that's very (   ), but I have to stay in and study for a test.","choices":["tempting","genetic","federal","bossy"],"answer":1,"translation":"A:エリカ、今夜中華料理を食べに行かない?\nB:中華は大好きだから、すごく心惹かれるけど、家でテスト勉強しなきゃ。","choiceMeanings":["魅力的な","遺伝の","連邦の","威張った"],"explanation":"誘いが魅力的だが断る→tempting。"},
{"id":"2017-3-12","session":"2017-3","number":12,"question":"The artist's paintings are famous for their (   ) of life in big cities. She is especially well-known for her paintings of families in urban parks.","choices":["depiction","grain","oppression","unrest"],"answer":1,"translation":"その画家の絵は、大都市の生活の描写で有名だ。特に都会の公園にいる家族を描いた絵がよく知られている。","choiceMeanings":["描写","粒","抑圧","不安・騒乱"],"explanation":"depiction of ~「~の描写」。"},
{"id":"2017-3-13","session":"2017-3","number":13,"question":"Although many of the bones in Drew's hand were crushed in the accident, his surgeon was able to (   ) it. Today, he is able to use it normally, and it looks as if it had never been injured.","choices":["drain","subscribe","propel","reconstruct"],"answer":4,"translation":"事故でドリューの手の骨の多くが砕けたが、外科医は手を再建することができた。今では普通に使え、まるで怪我をしたことがないように見える。","choiceMeanings":["排水する","購読する","推進する","再建する"],"explanation":"砕けた手を元通りに→reconstruct。"},
{"id":"2017-3-14","session":"2017-3","number":14,"question":"During the week, the road in front of Frank and Ellen's house was always (   ) with traffic, but on the weekends, it was quite empty.","choices":["drenched","congested","relieved","splintered"],"answer":2,"translation":"平日、フランクとエレンの家の前の道はいつも交通で渋滞していたが、週末はかなり空いていた。","choiceMeanings":["ずぶ濡れの","混雑した","安心した","裂けた"],"explanation":"congested with traffic(渋滞している)。"},
{"id":"2017-3-15","session":"2017-3","number":15,"question":"The man was arrested and taken into police (   ) after trying to rob a convenience store.","choices":["currency","custody","collapse","configuration"],"answer":2,"translation":"その男はコンビニ強盗を試みた後、逮捕されて警察に拘留された。","choiceMeanings":["通貨","拘留","崩壊","配置"],"explanation":"in police custody(警察の拘留下)。"},
{"id":"2017-3-16","session":"2017-3","number":16,"question":"When Craig became homeless, he felt like an (   ). With nowhere to go and no one to help him, it was as if he were completely removed from society.","choices":["outcast","ambassador","organism","ancestor"],"answer":1,"translation":"ホームレスになったとき、クレイグは社会ののけ者のように感じた。行く場所も助けてくれる人もなく、まるで社会から完全に切り離されたかのようだった。","choiceMeanings":["のけ者","大使","生物","祖先"],"explanation":"社会から切り離された感覚→outcast。"},
{"id":"2017-3-17","session":"2017-3","number":17,"question":"Since being (   ) for his beliefs many years ago, Reza has been living in England. He will likely be imprisoned if he goes back to his home country.","choices":["interrupted","grasped","exiled","decoded"],"answer":3,"translation":"何年も前に信条ゆえに追放されて以来、レザはイギリスで暮らしている。母国に戻れば投獄される可能性が高い。","choiceMeanings":["中断された","つかまれた","追放された","解読された"],"explanation":"信条ゆえに国外へ→exile(追放する)。"},
{"id":"2017-3-18","session":"2017-3","number":18,"question":"A: Honey, that was delicious! Thanks for cooking tonight.\nB: My pleasure. And it was (   ) as well. I used only healthy ingredients because I know you've been trying to eat better recently.","choices":["anxious","suspicious","devious","nutritious"],"answer":4,"translation":"A:ねえ、おいしかった!今夜は作ってくれてありがとう。\nB:どういたしまして。栄養もあったのよ。最近あなたが食生活を改善しようとしているから、健康的な食材だけ使ったの。","choiceMeanings":["不安な","疑わしい","ずる賢い","栄養のある"],"explanation":"healthy ingredients → nutritious。"},
{"id":"2017-3-19","session":"2017-3","number":19,"question":"Under the law of some countries, suspected criminals are (   ) innocent until proven guilty in court.","choices":["instilled","harassed","presumed","disregarded"],"answer":3,"translation":"一部の国の法律では、容疑者は法廷で有罪と証明されるまで無実と推定される。","choiceMeanings":["教え込まれた","嫌がらせを受けた","推定された","無視された"],"explanation":"presumed innocent(無罪推定)。"},
{"id":"2017-3-20","session":"2017-3","number":20,"question":"A: Honey, I want to call Cindy to see how she's doing in Japan. The code for Tokyo is 03, right?\nB: Yes, but you need to (   ) the first number as it's an international call. Just dial 3, not 03.","choices":["seize","omit","thaw","insure"],"answer":2,"translation":"A:ねえ、シンディが日本でどうしてるか電話したいの。東京の市外局番は03よね?\nB:そうだけど、国際電話だから最初の数字は省かないと。03じゃなく3だけ押して。","choiceMeanings":["つかむ","省く","解凍する","保険をかける"],"explanation":"0でなく3だけ→最初の数字をomit(省略)。"},
{"id":"2017-3-21","session":"2017-3","number":21,"question":"People in Japan who are sick with the common cold often wear a mask to avoid (   ) the virus.","choices":["transmitting","conforming","detaining","chilling"],"answer":1,"translation":"日本では、風邪をひいている人はウイルスをうつさないようにしばしばマスクをつける。","choiceMeanings":["伝染させる","従う","拘留する","冷やす"],"explanation":"transmit the virus(ウイルスを伝染させる)。"},
{"id":"2017-3-22","session":"2017-3","number":22,"question":"A: I've made a list of people to invite to our wedding party, but it's much too long.\nB: Well, let's (   ) the people we don't know so well and invite the ones who are left.","choices":["smooth over","burn out","give off","cross out"],"answer":4,"translation":"A:結婚パーティーに招待する人のリストを作ったけど、長すぎるの。\nB:じゃあ、あまりよく知らない人を線で消して、残った人を招待しよう。","choiceMeanings":["丸く収める","燃え尽きる","放出する","線を引いて消す"],"explanation":"リストから外す→cross out。"},
{"id":"2017-3-23","session":"2017-3","number":23,"question":"Gina's passport was stolen while she was traveling abroad. Talking to the police and applying for a new passport (   ) four whole days of her vacation.","choices":["aired out","made over","ate up","ran against"],"answer":3,"translation":"ジーナは海外旅行中にパスポートを盗まれた。警察と話し新しいパスポートを申請することで、休暇の丸4日が費やされた。","choiceMeanings":["風を通した","作り直した","(時間を)食いつぶした","~に逆らった"],"explanation":"eat up ~で時間などを使い果たす。"},
{"id":"2017-3-24","session":"2017-3","number":24,"question":"The new clothing brand was a big success, and soon its stores were (   ) all over the country. Within five years, there was at least one in every major city.","choices":["cracking up","springing up","falling through","evening out"],"answer":2,"translation":"その新しい衣料ブランドは大成功し、すぐに店舗が全国各地に次々と現れた。5年以内に、主要都市すべてに少なくとも1店舗ができた。","choiceMeanings":["大笑いする","次々と現れる","失敗に終わる","均等になる"],"explanation":"spring up(急に現れる)。"},
{"id":"2017-3-25","session":"2017-3","number":25,"question":"The train was supposed to arrive at four o'clock, so when it finally (   ) at five-thirty, many of the passengers were very angry.","choices":["picked through","carried through","pulled in","tidied up"],"answer":3,"translation":"列車は4時に到着するはずだったので、5時半にようやく到着したとき、多くの乗客はとても怒っていた。","choiceMeanings":["選り分けた","やり遂げた","(駅に)到着した","片付けた"],"explanation":"pull in(列車が駅に入る)。"},
{"id":"2018-1-01","session":"2018-1","number":1,"question":"Jack was awakened in the night by a loud (   ) coming from his daughter's bedroom. It turned out she had had a bad dream.","choices":["deed","phase","vein","shriek"],"answer":4,"translation":"ジャックは夜中に娘の寝室から聞こえる大きな悲鳴で目を覚ました。娘は悪い夢を見たのだと分かった。","choiceMeanings":["行為","段階","静脈","金切り声"],"explanation":"悪夢で叫ぶ→shriek。"},
{"id":"2018-1-02","session":"2018-1","number":2,"question":"Humans were mostly hunters and gatherers until the (   ) of plants and animals. Now, most cultures grow crops and raise animals for food.","choices":["adhesion","outburst","domestication","recruitment"],"answer":3,"translation":"人類は動植物の家畜化・栽培化まで、主に狩猟採集民だった。今ではほとんどの文化が作物を育て、食料のために動物を飼育している。","choiceMeanings":["接着","爆発","家畜化・栽培化","採用"],"explanation":"grow crops and raise animals → domestication。"},
{"id":"2018-1-03","session":"2018-1","number":3,"question":"A: Can I get this pain-relief medicine over the counter? My prescription ran out.\nB: No. Only a licensed pharmacist can (   ) that drug. You'll have to get your prescription renewed.","choices":["repeal","diminish","hinder","dispense"],"answer":4,"translation":"A:この鎮痛薬は店頭で買えますか?処方箋が切れてしまって。\nB:いいえ。その薬は資格のある薬剤師しか調剤できません。処方箋を更新してもらってください。","choiceMeanings":["廃止する","減らす","妨げる","調剤する"],"explanation":"dispense a drug(薬を調剤・分配する)。"},
{"id":"2018-1-04","session":"2018-1","number":4,"question":"The city introduced strict water (   ) measures because of unusually low rainfall. For instance, residents were told they could not water their lawns.","choices":["simulation","excess","sincerity","conservation"],"answer":4,"translation":"異常な少雨のため、市は厳しい節水対策を導入した。例えば、住民は芝生に水をまくことを禁じられた。","choiceMeanings":["模擬実験","超過","誠実さ","保全・節約"],"explanation":"water conservation(節水)。"},
{"id":"2018-1-05","session":"2018-1","number":5,"question":"Hugo doesn't have enough time to read the full texts of classic books, so he buys (   ) versions of them to read while commuting to work.","choices":["abridged","supreme","notorious","hysterical"],"answer":1,"translation":"ヒューゴーは古典の全文を読む時間がないので、通勤中に読めるよう要約版を買っている。","choiceMeanings":["要約された","最高の","悪名高い","ヒステリックな"],"explanation":"full textsと対比→abridged version(短縮版)。"},
{"id":"2018-1-06","session":"2018-1","number":6,"question":"A period of military service for young men in many countries is (   ). They are required to report for duty or face prison.","choices":["indefinite","mandatory","graphic","daring"],"answer":2,"translation":"多くの国で若い男性の兵役期間は義務である。彼らは出頭しなければ刑務所に入れられる。","choiceMeanings":["無期限の","義務的な","生々しい","大胆な"],"explanation":"required, face prison → mandatory。"},
{"id":"2018-1-07","session":"2018-1","number":7,"question":"Sue's parents wanted her to continue her college education, but she (   ) their wishes by dropping out to pursue a modeling career.","choices":["attained","empowered","defied","expanded"],"answer":3,"translation":"スーの両親は彼女に大学教育を続けてほしかったが、彼女は中退してモデルの道を追うことで両親の望みに逆らった。","choiceMeanings":["達成した","力を与えた","逆らった","拡大した"],"explanation":"wishesに反して中退→defy。"},
{"id":"2018-1-08","session":"2018-1","number":8,"question":"To the teacher's surprise, most students performed (   ) well on the exam. She had expected more of them to struggle with the difficult questions.","choices":["abruptly","humorously","exceptionally","sarcastically"],"answer":3,"translation":"先生が驚いたことに、ほとんどの生徒が試験で非常によくできた。難問に苦戦する生徒がもっと多いと予想していたのだ。","choiceMeanings":["突然に","ユーモラスに","非常に","皮肉っぽく"],"explanation":"exceptionally well(並外れてよく)。"},
{"id":"2018-1-09","session":"2018-1","number":9,"question":"The racecar drivers came to a complete (   ) because of the accident. The race started again once the damaged car had been cleared from the track.","choices":["menace","contraction","millennium","standstill"],"answer":4,"translation":"事故のためレーサーたちは完全に停止した。壊れた車がコースから撤去されると、レースは再開された。","choiceMeanings":["脅威","収縮","千年間","停止"],"explanation":"come to a standstill(完全に止まる)。"},
{"id":"2018-1-10","session":"2018-1","number":10,"question":"The couple found painting their house (   ) at first. However, when they started playing lively music while they worked, it became less boring.","choices":["mellow","eventful","tedious","primary"],"answer":3,"translation":"夫婦は最初、家のペンキ塗りを退屈だと感じた。しかし作業中に軽快な音楽をかけ始めると、それほど退屈でなくなった。","choiceMeanings":["円熟した","出来事の多い","退屈な","主要な"],"explanation":"less boringと呼応→tedious。"},
{"id":"2018-1-11","session":"2018-1","number":11,"question":"Athletes are advised to drink water frequently during their workouts in order to prevent (   ).","choices":["dehydration","visibility","chatter","literacy"],"answer":1,"translation":"運動選手は、脱水を防ぐために運動中にこまめに水を飲むよう勧められている。","choiceMeanings":["脱水","視界","おしゃべり","読み書き能力"],"explanation":"水を飲んで防ぐもの→dehydration。"},
{"id":"2018-1-12","session":"2018-1","number":12,"question":"A strong storm hit the small island nation last week. Luckily, there were no (   ), but 11 people received minor injuries and were treated at hospitals.","choices":["sculptures","boundaries","columns","fatalities"],"answer":4,"translation":"先週、強い嵐が小さな島国を襲った。幸い死者は出なかったが、11人が軽傷を負い病院で手当てを受けた。","choiceMeanings":["彫刻","境界","柱","死者"],"explanation":"Luckily + minor injuries → no fatalities。"},
{"id":"2018-1-13","session":"2018-1","number":13,"question":"Janet (   ) her brother with watching her dog while she was on vacation. She knew he would take excellent care of it.","choices":["entrusted","scraped","paved","simmered"],"answer":1,"translation":"ジャネットは休暇中、弟に犬の世話を任せた。弟なら立派に世話してくれると分かっていた。","choiceMeanings":["委ねた","こすった","舗装した","とろ火で煮た"],"explanation":"entrust A with B「AにBを任せる」。"},
{"id":"2018-1-14","session":"2018-1","number":14,"question":"A: I know this apology is (   ), but I want to say that I'm sorry for being so rude to you last week.\nB: Thank you, but I wish you'd said something earlier.","choices":["overdue","blurry","consecutive","plural"],"answer":1,"translation":"A:この謝罪が遅すぎるのは分かってるけど、先週あんなに失礼だったことを謝りたいんだ。\nB:ありがとう。でももっと早く言ってほしかったな。","choiceMeanings":["遅れた・期限を過ぎた","ぼやけた","連続した","複数の"],"explanation":"I wish you'd said earlier → overdue。"},
{"id":"2018-1-15","session":"2018-1","number":15,"question":"Yesterday, Joe (   ) missed being involved in a car accident. Another car suddenly pulled out in front of him, and he had to react quickly to avoid it.","choices":["shamelessly","enviously","narrowly","frankly"],"answer":3,"translation":"昨日、ジョーは危うく自動車事故に巻き込まれるところだった。別の車が突然目の前に出てきて、避けるために素早く反応しなければならなかった。","choiceMeanings":["恥知らずに","うらやましそうに","かろうじて","率直に"],"explanation":"narrowly miss(間一髪で免れる)。"},
{"id":"2018-1-16","session":"2018-1","number":16,"question":"Mrs. Smith called the police after seeing a man walk up to several homes on her street, but her suspicions were (   ). He was working for a delivery company.","choices":["irregular","dismayed","uneasy","unwarranted"],"answer":4,"translation":"スミス夫人は通りの数軒の家に男が近づくのを見て警察に通報したが、その疑いは根拠のないものだった。男は配達会社の仕事をしていたのだ。","choiceMeanings":["不規則な","狼狽した","不安な","根拠のない"],"explanation":"実は配達員→疑いはunwarranted。"},
{"id":"2018-1-17","session":"2018-1","number":17,"question":"The manager got angry at his staff for being (   ). He said it was taking them twice as long to complete tasks as it should.","choices":["inefficient","gaudy","cowardly","cumulative"],"answer":1,"translation":"部長は部下が非効率だと怒った。作業を終えるのに本来の2倍の時間がかかっていると言った。","choiceMeanings":["非効率な","けばけばしい","臆病な","累積的な"],"explanation":"2倍の時間→inefficient。"},
{"id":"2018-1-18","session":"2018-1","number":18,"question":"Just before takeoff, the flight instructor decided to (   ) his student's training flight because of bad weather. He rescheduled it for another day.","choices":["abort","summon","mold","stumble"],"answer":1,"translation":"離陸直前、飛行教官は悪天候のため生徒の訓練飛行を中止することにした。彼は別の日に予定を組み直した。","choiceMeanings":["中止する","召喚する","型にはめる","つまずく"],"explanation":"rescheduledから→abort(中止)。"},
{"id":"2018-1-19","session":"2018-1","number":19,"question":"A: Why did you choose to major in psychology, Tara?\nB: I became (   ) by it when I took a psychology class during my first year. Every textbook I read made me want to learn more.","choices":["sheltered","intrigued","modified","dreaded"],"answer":2,"translation":"A:ターラ、どうして心理学を専攻したの?\nB:1年生のときに心理学の授業を取って興味をそそられたの。どの教科書を読んでももっと学びたくなったわ。","choiceMeanings":["保護された","興味をそそられた","修正された","恐れられた"],"explanation":"be intrigued by ~「~に興味をそそられる」。"},
{"id":"2018-1-20","session":"2018-1","number":20,"question":"From the first time Alice's music teacher heard her play, he knew she was (   ) to become famous. He had never taught such a talented young violinist.","choices":["scattered","wrinkled","falsified","destined"],"answer":4,"translation":"アリスの音楽教師は、彼女の演奏を初めて聴いたときから、彼女が有名になる運命にあると分かっていた。これほど才能ある若いバイオリニストを教えたことはなかった。","choiceMeanings":["散らばった","しわの寄った","改ざんされた","運命づけられた"],"explanation":"be destined to ~「~する運命にある」。"},
{"id":"2018-1-21","session":"2018-1","number":21,"question":"A: I'm sorry, Becky. I shouldn't have told anyone about your secret date with Marc.\nB: How could you (   ) me like that? I'll never talk to you about my private life again.","choices":["ascend","betray","cherish","uphold"],"answer":2,"translation":"A:ごめん、ベッキー。マークとの秘密のデートを誰かに話すべきじゃなかった。\nB:よくもそんなふうに私を裏切れたわね。もう二度と私生活のことは話さないから。","choiceMeanings":["登る","裏切る","大切にする","支持する"],"explanation":"秘密を漏らした→betray(裏切る)。"},
{"id":"2018-1-22","session":"2018-1","number":22,"question":"Wendy thought she was going to (   ) a lot of money when her grandfather died. She was shocked to learn that he had left her almost nothing.","choices":["come into","bring about","close in","sum up"],"answer":1,"translation":"ウェンディは祖父が亡くなったら大金を相続すると思っていた。祖父が彼女にほとんど何も残さなかったと知り、衝撃を受けた。","choiceMeanings":["(遺産など)を相続する","~を引き起こす","迫る","~を要約する"],"explanation":"come into money(遺産を受け継ぐ)。"},
{"id":"2018-1-23","session":"2018-1","number":23,"question":"When Glen took his car to get a tire fixed, he also asked the mechanic to (   ) the engine. He was pleased by how much better the car ran afterward.","choices":["call on","hang up","show off","tune up"],"answer":4,"translation":"グレンはタイヤを直してもらいに車を持って行ったとき、整備士にエンジンの調整も頼んだ。その後、車の走りがずっと良くなって喜んだ。","choiceMeanings":["~を訪問する","電話を切る","見せびらかす","(エンジンなどを)調整する"],"explanation":"tune up the engine(エンジンを調整する)。"},
{"id":"2018-1-24","session":"2018-1","number":24,"question":"A: Are you sure you want to go to the protest, Shari?\nB: Yes. I can't just (   ) while an important, historic building is destroyed. I would feel terrible if I didn't try to stop it.","choices":["sink in","sit by","wear off","make out"],"answer":2,"translation":"A:本当に抗議活動に行くの、シャリ?\nB:ええ。重要な歴史的建物が壊されるのを黙って傍観してはいられないわ。止めようとしなかったらひどい気分になるもの。","choiceMeanings":["染み込む","傍観する","徐々に消える","見分ける"],"explanation":"sit by(傍観する)。"},
{"id":"2018-1-25","session":"2018-1","number":25,"question":"Kevin realized his long years of service to the company did not (   ) anything when he was suddenly fired as part of a cost-cutting measure.","choices":["count for","go back on","sell out","do away with"],"answer":1,"translation":"ケビンは、コスト削減策の一環で突然解雇されたとき、会社への長年の勤務が何の価値もなかったことに気づいた。","choiceMeanings":["価値がある","~を破る","売り切れる","~を廃止する"],"explanation":"not count for anything(何の意味もない)。"},
{"id":"2018-2-01","session":"2018-2","number":1,"question":"\"The (   ) of today's training course is to teach you how to operate all of the machines safely,\" said the manager. \"This will help reduce the number of accidents in the factory.\"","choices":["incidence","sanction","objective","occupancy"],"answer":3,"translation":"「本日の研修の目的は、すべての機械を安全に操作する方法を教えることです」と部長は言った。「これは工場での事故件数を減らす助けになります。」","choiceMeanings":["発生率","制裁","目的","占有"],"explanation":"to teach ~が内容を示すのでobjective(目的)。"},
{"id":"2018-2-02","session":"2018-2","number":2,"question":"Consumers should be aware that the rates some companies advertise for their services can be (   ). Various additional charges often have to be paid.","choices":["gratifying","misleading","attentive","defective"],"answer":2,"translation":"消費者は、一部の企業が宣伝するサービス料金が誤解を招くものである可能性に注意すべきだ。さまざまな追加料金を払わなければならないことが多い。","choiceMeanings":["満足させる","誤解を招く","注意深い","欠陥のある"],"explanation":"追加料金がかかる→宣伝は誤解を招く。"},
{"id":"2018-2-03","session":"2018-2","number":3,"question":"Before the couple (   ) on their three-day hike in the wilderness, they made sure they had enough food and water.","choices":["fastened","embarked","dictated","applauded"],"answer":2,"translation":"夫婦は荒野での3日間のハイキングに出発する前に、十分な食料と水があることを確認した。","choiceMeanings":["固定した","乗り出した","口述した","拍手した"],"explanation":"embark on ~「~に乗り出す」。"},
{"id":"2018-2-04","session":"2018-2","number":4,"question":"The drivers of the two cars disagreed about how the accident occurred, so the police officer questioned some (   ) at the scene to find out what really happened.","choices":["pioneers","innovators","bystanders","successors"],"answer":3,"translation":"2台の車の運転手は事故の起こり方について意見が食い違ったので、警察官は何が実際に起きたのかを知るため、現場にいた傍観者数人に尋ねた。","choiceMeanings":["開拓者","革新者","傍観者","後継者"],"explanation":"現場にいた目撃者→bystanders。"},
{"id":"2018-2-05","session":"2018-2","number":5,"question":"A: Great news! I heard Farouk will be promoted to chief accounting officer.\nB: Let's not celebrate yet. The board's decision is still (   ).","choices":["smudging","consenting","receding","pending"],"answer":4,"translation":"A:いいニュースだよ!ファルークが最高会計責任者に昇進するって聞いたよ。\nB:まだ祝うのは早いよ。取締役会の決定はまだ保留中だから。","choiceMeanings":["汚している","同意している","後退している","未決定の"],"explanation":"まだ祝わない→決定は「未決」pending。"},
{"id":"2018-2-06","session":"2018-2","number":6,"question":"After the general surrounded the city with his troops, he demanded the (   ) surrender of the enemy.","choices":["unconditional","deceptive","unfaithful","primitive"],"answer":1,"translation":"将軍は軍隊で都市を包囲した後、敵の無条件降伏を要求した。","choiceMeanings":["無条件の","人を欺く","不誠実な","原始的な"],"explanation":"unconditional surrender(無条件降伏)。"},
{"id":"2018-2-07","session":"2018-2","number":7,"question":"Raw vegetables are more difficult to (   ) than cooked ones. It is much easier for the body to process cooked foods.","choices":["digest","inspire","thrust","smash"],"answer":1,"translation":"生野菜は加熱したものより消化しにくい。体は加熱した食べ物のほうがずっと処理しやすい。","choiceMeanings":["消化する","奮い立たせる","突き出す","打ち砕く"],"explanation":"体が処理する→digest。"},
{"id":"2018-2-08","session":"2018-2","number":8,"question":"Lena was (   ) thinner when she returned from her year abroad. In fact, many of her friends said they did not recognize her at first.","choices":["briefly","doubtfully","cautiously","notably"],"answer":4,"translation":"レナは1年間の海外生活から戻ったとき、著しく痩せていた。実際、友人の多くは最初彼女だと分からなかったと言った。","choiceMeanings":["簡潔に","疑わしげに","慎重に","著しく"],"explanation":"notably thinner(際立って痩せた)。"},
{"id":"2018-2-09","session":"2018-2","number":9,"question":"The official was jailed for (   ). He had accepted money from manufacturing companies in exchange for covering up their illegal dumping of chemical waste.","choices":["misery","bribery","artistry","irony"],"answer":2,"translation":"その役人は収賄で投獄された。製造会社から金を受け取り、その見返りに化学廃棄物の違法投棄を隠蔽していたのだ。","choiceMeanings":["悲惨","贈収賄","芸術性","皮肉"],"explanation":"金を受け取り不正を隠す→bribery。"},
{"id":"2018-2-10","session":"2018-2","number":10,"question":"Roy hated the idea of selling his guitar. However, he needed the money, so he eventually overcame his (   ) and put an advertisement in the newspaper.","choices":["projection","petition","reluctance","abundance"],"answer":3,"translation":"ロイはギターを売ることが嫌でたまらなかった。しかしお金が必要だったので、ついにためらいを克服して新聞に広告を出した。","choiceMeanings":["投影","請願","気が進まないこと","豊富さ"],"explanation":"hated the idea → reluctance(気乗りのなさ)。"},
{"id":"2018-2-11","session":"2018-2","number":11,"question":"A: Tom, it was really (   ) of you not to offer Stan a ride after the game. He had to walk three kilometers to get home!\nB: Sorry. I thought he would have asked if he wanted a ride.","choices":["inconsiderate","fundamental","generic","plentiful"],"answer":1,"translation":"A:トム、試合後にスタンを車に乗せてあげなかったなんて本当に思いやりがないよ。彼は家まで3キロ歩かなきゃならなかったんだよ!\nB:ごめん。乗りたければ彼のほうから頼んだと思ったんだ。","choiceMeanings":["思いやりのない","基本的な","一般的な","豊富な"],"explanation":"批判の文脈→inconsiderate。"},
{"id":"2018-2-12","session":"2018-2","number":12,"question":"The forest (   ) of many animals is being destroyed by logging companies. Environmentalists fear these animals will soon have nowhere to live.","choices":["dose","riot","blockade","habitat"],"answer":4,"translation":"多くの動物の森林の生息地が伐採会社によって破壊されている。環境保護活動家は、これらの動物がまもなく住む場所を失うことを恐れている。","choiceMeanings":["1回分の量","暴動","封鎖","生息地"],"explanation":"nowhere to liveからhabitat。"},
{"id":"2018-2-13","session":"2018-2","number":13,"question":"Leaders in both countries hope the newly signed peace (   ) will not be broken. No one wants the fighting to carry on any longer.","choices":["creek","accord","venue","estate"],"answer":2,"translation":"両国の指導者は、新たに調印された和平協定が破られないことを望んでいる。誰も戦闘がこれ以上続くことを望んでいない。","choiceMeanings":["小川","協定","会場","地所"],"explanation":"peace accord(和平協定)。"},
{"id":"2018-2-14","session":"2018-2","number":14,"question":"A: I can't believe how (   ) Chris is.\nB: Yes, once he decides he wants to do something a certain way, he won't listen to any suggestions or advice.","choices":["blissful","witty","stubborn","damp"],"answer":3,"translation":"A:クリスがどれだけ頑固か信じられないよ。\nB:ほんと、一度あるやり方でやりたいと決めたら、どんな提案や助言にも耳を貸さないよね。","choiceMeanings":["至福の","機知に富んだ","頑固な","湿った"],"explanation":"won't listen to advice → stubborn。"},
{"id":"2018-2-15","session":"2018-2","number":15,"question":"Liz is finding it tough to follow her diet. She constantly (   ) chocolate and cannot stop eating it between meals.","choices":["pierces","craves","endorses","comprises"],"answer":2,"translation":"リズはダイエットを守るのが難しいと感じている。彼女は常にチョコレートを欲しがり、食間に食べるのをやめられない。","choiceMeanings":["突き刺す","切望する","支持する","構成する"],"explanation":"食べずにいられない→crave(渇望する)。"},
{"id":"2018-2-16","session":"2018-2","number":16,"question":"A: I always like to take a (   ) around the block before bed.\nB: Really? If I do anything active at night, even a short walk like that, I can't get to sleep.","choices":["sanctuary","gasp","revelation","stroll"],"answer":4,"translation":"A:私は寝る前にいつも近所をぶらぶら散歩するのが好きなの。\nB:本当?夜に体を動かすと、あんな短い散歩でも眠れなくなるよ。","choiceMeanings":["聖域","あえぎ","暴露","散歩"],"explanation":"take a stroll(散歩する)。"},
{"id":"2018-2-17","session":"2018-2","number":17,"question":"Our coach's (   ) words after we lost the game motivated us. She said she knew we were very capable and would do better next time.","choices":["vain","uplifting","awkward","tasteless"],"answer":2,"translation":"試合に負けた後のコーチの元気づける言葉が私たちのやる気を高めた。コーチは、私たちには大いに能力があり、次はもっとうまくやれると分かっていると言った。","choiceMeanings":["むなしい","元気づける","ぎこちない","味気ない"],"explanation":"motivatedに合うのはuplifting。"},
{"id":"2018-2-18","session":"2018-2","number":18,"question":"A: Before I invest in your new company, I'd like you to (   ) the help of an outside expert to guide you for the first few months.\nB: That seems reasonable. I know a consultant who can help us.","choices":["roll up","enlist","drift","curse"],"answer":2,"translation":"A:あなたの新会社に投資する前に、最初の数か月を導いてくれる外部の専門家の助けを求めてほしい。\nB:妥当ですね。助けてくれるコンサルタントを知っています。","choiceMeanings":["巻き上げる","(協力を)得る","漂う","呪う"],"explanation":"enlist the help of ~(~の協力を得る)。"},
{"id":"2018-2-19","session":"2018-2","number":19,"question":"Banks will usually only (   ) loans for people who have good financial histories. If you have had money troubles, it is unlikely they will loan you any money.","choices":["tame","penetrate","despise","authorize"],"answer":4,"translation":"銀行は通常、良好な財務履歴のある人にしか融資を承認しない。金銭トラブルがあった場合、融資してもらえる可能性は低い。","choiceMeanings":["飼いならす","貫通する","軽蔑する","承認する"],"explanation":"authorize loans(融資を承認する)。"},
{"id":"2018-2-20","session":"2018-2","number":20,"question":"The athlete hired a lawyer to fight the (   ) that he had used illegal drugs. He said the charges made against him were false.","choices":["inclination","predator","allegation","ascent"],"answer":3,"translation":"その選手は違法薬物を使用したという疑惑と闘うため弁護士を雇った。彼は自分に対する告発は虚偽だと述べた。","choiceMeanings":["傾向","捕食者","(根拠のない)申し立て","上昇"],"explanation":"charges...were false と言い換えられる→allegation。"},
{"id":"2018-2-21","session":"2018-2","number":21,"question":"The house fire quickly spread to nearby buildings and was still burning hours after firefighters arrived. Viewers watching the scene (   ) on television could not believe the damage.","choices":["eject","twist","unfold","confer"],"answer":3,"translation":"住宅火災は近隣の建物にすぐに燃え広がり、消防隊の到着から数時間後もまだ燃えていた。テレビで現場が展開するのを見ていた視聴者は被害が信じられなかった。","choiceMeanings":["排出する","ねじる","(事態が)展開する","協議する"],"explanation":"watch the scene unfold(場面が繰り広げられるのを見る)。"},
