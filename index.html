];

(() => {
  "use strict";
  const STORAGE_KEY = "eiken-pre1-reading-part1-progress-v1";
  const $ = (id) => document.getElementById(id);
  const els = {
    session: $("sessionFilter"), mode: $("modeFilter"), mastered: $("masteredCount"),
    accuracy: $("accuracy"), review: $("reviewCount"), attempts: $("attemptCount"),
    progress: $("progressFill"), progressBar: $("progressBar"), position: $("questionPosition"),
    timer: $("timer"), question: $("questionText"), choices: $("choices"),
    feedback: $("feedback"), result: $("resultText"), translation: $("translation"),
    meanings: $("meaningList"), explanation: $("explanation"), next: $("nextBtn"),
    skip: $("skipBtn"), reset: $("resetBtn"), quiz: $("quizArea"), empty: $("emptyState"),
    emptyTitle: $("emptyTitle"), emptyMessage: $("emptyMessage")
  };

  let progress = loadProgress();
  let queue = [];
  let queueIndex = 0;
  let current = null;
  let answered = false;
  let startedAt = 0;
  let elapsed = 0;
  let timerHandle = null;
  let sessionCorrect = 0;
  let sessionAnswered = 0;

  function loadProgress() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      return parsed && typeof parsed === "object" ? parsed : {};
    } catch (_) { return {}; }
  }
  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
    catch (_) { /* Safariのプライベートブラウズ等で保存できない場合も演習は続行 */ }
  }
  function stateFor(id) {
    return progress[id] || { status: "new", attempts: 0, correct: 0 };
  }
  function allStats() {
    let mastered = 0, review = 0, attempts = 0, correct = 0;
    QUESTIONS.forEach(q => {
      const s = stateFor(q.id);
      if (s.status === "mastered") mastered++;
      if (s.status === "review") review++;
      attempts += Number(s.attempts) || 0;
      correct += Number(s.correct) || 0;
    });
    return { mastered, review, attempts, correct };
  }
  function renderStats() {
    const s = allStats();
    const total = QUESTIONS.length;
    const pct = total ? Math.round(s.mastered / total * 100) : 0;
    els.mastered.textContent = `${s.mastered} / ${total}問`;
    els.progress.style.width = pct + "%";
    els.progressBar.setAttribute("aria-valuemax", String(total));
    els.progressBar.setAttribute("aria-valuenow", String(s.mastered));
    els.accuracy.textContent = s.attempts ? `${Math.round(s.correct / s.attempts * 100)}%` : "—";
    els.review.textContent = `${s.review}問`;
    els.attempts.textContent = `${s.attempts}問`;
  }
  function shuffle(items) {
    const a = items.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function makeQueue() {
    const session = els.session.value;
    const mode = els.mode.value;
    let list = QUESTIONS.filter(q => session === "all" || q.session === session);
    if (mode === "review") list = list.filter(q => stateFor(q.id).status === "review");
    if (mode === "unmastered") list = list.filter(q => stateFor(q.id).status !== "mastered");
    return shuffle(list);
  }
  function stopTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = null;
  }
  function updateTimer() {
    elapsed = Math.floor((Date.now() - startedAt) / 1000);
    els.timer.textContent = `${String(elapsed).padStart(2, "0")}秒`;
    els.timer.classList.toggle("over", elapsed > 20);
  }
  function startTimer() {
    stopTimer();
    startedAt = Date.now();
    elapsed = 0;
    updateTimer();
    timerHandle = setInterval(() => { if (!answered) updateTimer(); }, 250);
  }
  function beginRun() {
    stopTimer();
    queue = makeQueue();
    queueIndex = 0;
    sessionCorrect = 0;
    sessionAnswered = 0;
    if (!queue.length) {
      current = null;
      els.quiz.classList.add("hidden");
      els.empty.classList.remove("hidden");
      els.emptyTitle.textContent = "対象の問題がありません";
      const mode = els.mode.value;
      els.emptyMessage.textContent = mode === "review"
        ? "要復習の問題はありません。間違えた問題ができると、ここに追加されます。"
        : mode === "unmastered"
          ? "この範囲の問題はすべて習得済みです。"
          : "この出題範囲には問題データがありません。";
      return;
    }
    els.empty.classList.add("hidden");
    els.quiz.classList.remove("hidden");
    renderQuestion();
  }
  function renderQuestion() {
    stopTimer();
    current = queue[queueIndex];
    answered = false;
    els.position.textContent = `${queueIndex + 1} / ${queue.length}問 · ${current.session} 第${current.number}問`;
    els.question.textContent = current.question;
    els.choices.replaceChildren();
    current.choices.forEach((choice, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.dataset.index = String(index + 1);
      const num = document.createElement("span");
      num.className = "choice-num";
      num.textContent = String(index + 1);
      const label = document.createElement("span");
      label.textContent = choice;
      button.append(num, label);
      button.addEventListener("click", () => answer(index + 1));
      els.choices.append(button);
    });
    els.feedback.classList.add("hidden");
    els.skip.classList.remove("hidden");
    els.next.disabled = true;
    els.next.textContent = "回答を選択";
    els.timer.classList.remove("over");
    startTimer();
  }
  function answer(selected) {
    if (!current || answered) return;
    answered = true;
    updateTimer();
    stopTimer();
    const isCorrect = selected === current.answer;
    const old = stateFor(current.id);
    progress[current.id] = {
      status: isCorrect ? "mastered" : "review",
      attempts: (Number(old.attempts) || 0) + 1,
      correct: (Number(old.correct) || 0) + (isCorrect ? 1 : 0)
    };
    saveProgress();
    sessionAnswered++;
    if (isCorrect) sessionCorrect++;
    [...els.choices.children].forEach((button, index) => {
      button.disabled = true;
      if (index + 1 === current.answer) button.classList.add("correct");
      if (index + 1 === selected && !isCorrect) button.classList.add("wrong");
    });
    els.result.textContent = isCorrect ? `正解！ (${elapsed}秒)` : `不正解。正解は ${current.answer}：${current.choices[current.answer - 1]}`;
    els.result.className = "result " + (isCorrect ? "good" : "bad");
    els.translation.textContent = "訳： " + current.translation;
    els.meanings.replaceChildren();
    current.choices.forEach((choice, index) => {
      const li = document.createElement("li");
      if (index + 1 === current.answer) li.classList.add("correct-meaning");
      const b = document.createElement("b");
      b.textContent = `${index + 1}.`;
      const meaning = document.createElement("span");
      meaning.textContent = `${choice} — ${current.choiceMeanings[index]}`;
      li.append(b, meaning);
      if (index + 1 === current.answer) {
        const tag = document.createElement("span");
        tag.className = "answer-tag";
        tag.textContent = "正解";
        li.append(tag);
      }
      els.meanings.append(li);
    });
    els.explanation.textContent = current.explanation;
    els.feedback.classList.remove("hidden");
    els.skip.classList.add("hidden");
    els.next.disabled = false;
    els.next.textContent = queueIndex === queue.length - 1 ? "結果を確認" : "次の問題へ";
    renderStats();
  }
  function nextQuestion() {
    if (!answered) return;
    queueIndex++;
    if (queueIndex >= queue.length) {
      showSummary();
      return;
    }
    renderQuestion();
  }
  function showSummary() {
    stopTimer();
    current = null;
    els.quiz.classList.add("hidden");
    els.empty.classList.remove("hidden");
    els.emptyTitle.textContent = "今回の演習が終了しました";
    const rate = sessionAnswered ? Math.round(sessionCorrect / sessionAnswered * 100) : 0;
    els.emptyMessage.textContent = `${sessionAnswered}問中 ${sessionCorrect}問正解（正答率 ${rate}%）。設定を変えるか、もう一度演習できます。`;
    renderStats();
  }
  function skipQuestion() {
    if (!current || answered) return;
    stopTimer();
    queue.splice(queueIndex, 1);
    if (queueIndex >= queue.length) {
      if (queue.length) queueIndex = queue.length - 1;
      else {
        els.quiz.classList.add("hidden");
        els.empty.classList.remove("hidden");
        els.emptyTitle.textContent = "演習を終了しました";
        els.emptyMessage.textContent = "スキップした問題は学習履歴に記録していません。";
        current = null;
        return;
      }
    }
    renderQuestion();
  }

  els.next.addEventListener("click", nextQuestion);
  els.skip.addEventListener("click", skipQuestion);
  els.session.addEventListener("change", beginRun);
  els.mode.addEventListener("change", beginRun);
  els.reset.addEventListener("click", () => {
    if (!confirm("学習履歴（正解済み・要復習・解答数）をすべてリセットします。よろしいですか？")) return;
    progress = {};
    saveProgress();
    renderStats();
    beginRun();
  });
  document.addEventListener("keydown", event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.target && ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
    if (!current) return;
    if (!answered && /^[1-4]$/.test(event.key)) {
      event.preventDefault();
      answer(Number(event.key));
    } else if (answered && (event.key === "Enter" || event.key === " ")) {
      event.preventDefault();
      nextQuestion();
    }
  });

  renderStats();
  beginRun();
})();
</script>
</body>
</html>
